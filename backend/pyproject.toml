[project]
name = "cloudsentry-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "boto3>=1.43.114",
    "pydantic>=2.14.1",
    "anthropic>=0.34",
    # Transitive dependencies pinned to patched releases (known advisories in earlier versions).
    "urllib3>=2.8.0",
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# Unused imports/variables (F), likely bugs (B), modern syntax (UP).
select = ["F", "E9", "B", "UP"]

