# Keeps dependencies (and CI actions) patched. Security updates open PRs automatically.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /infra/terraform/iam
    schedule: { interval: monthly }
  - package-ecosystem: terraform
    directory: /infra/terraform/ecs
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
