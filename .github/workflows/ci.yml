name: CI
on:
  push: { branches: [main] }
  pull_request:

# Least privilege: CI only ever needs to read the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -e '.[dev]'
      - run: ruff check app scripts tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint:unused
      - run: npm test
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    strategy: { matrix: { dir: [iam, ecs] } }
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init -backend=false && terraform validate
        working-directory: infra/terraform/${{ matrix.dir }}

  audit:
    # Known-vulnerability scan of both dependency trees on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -e backend pip-audit && pip-audit --skip-editable
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm audit --audit-level=high
        working-directory: frontend
